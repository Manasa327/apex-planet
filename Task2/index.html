<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 2 - Web Development</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <h1>My Web Project</h1>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#contact">Contact</a>
                <a href="#todo">To-Do List</a>
            </div>

        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Home Section -->
        <section id="home" class="hero">

            <div>
                <h2>Welcome to My Task 2 Project</h2>

                <p>
                    This webpage demonstrates HTML, CSS and JavaScript
                    concepts including forms, validation, responsive
                    layouts and DOM manipulation.
                </p>
            </div>

        </section>


        <!-- Grid Section -->
        <section class="content-grid">

            <!-- Contact Form -->
            <div id="contact" class="box">

                <h2>Contact Form</h2>

                <form id="contactForm">

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Enter your message"
                    ></textarea>

                    <button type="submit">
                        Submit
                    </button>

                    <p id="formMessage"></p>

                </form>

            </div>
            <div id="todo" class="box">

                <h2>My To-Do List</h2>

                <div class="todo-input">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a task"
                    >

                    <button id="addTask">
                        Add
                    </button>

                </div>

                <ul id="taskList"></ul>

            </div>

        </section>

    </main>

    <footer>

        <p>
            2026 ApexPlanet Internship - Task 2
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
